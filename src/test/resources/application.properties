spring.datasource.url=jdbc:h2:mem:ctsh_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.security.pepper=${CTSH_PEPPER:change-me-pepper}

app.jwt.secret=${CTSH_JWT_SECRET:change-me-secret-change-me-secret-123456!}
app.jwt.ttl-seconds=3600

app.cookie.name=jwt
app.cookie.secure=true
app.cookie.same-site=Strict
app.cookie.max-age-seconds=${app.jwt.ttl-seconds}

app.url.backend=${CTSH_BACKEND_URL:http://localhost:8080}
app.url.frontend=${CTSH_FRONTEND_URL:http://localhost:3000}
app.uploads.dir=target/test-uploads
app.uploads.url-path=/target/test-uploads
