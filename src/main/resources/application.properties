spring.application.name=ctsh_api

spring.datasource.url=jdbc:mysql://localhost:3306/ctsh_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=ctsh_user
spring.datasource.password=ctsh_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
server.servlet.context-path=/api
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.security.pepper=${CTSH_PEPPER:change-me-pepper}

app.jwt.secret=${CTSH_JWT_SECRET:change-me-secret-change-me-secret-123456!}
app.jwt.ttl-seconds=3600

app.cookie.name=jwt
app.cookie.secure=true
app.cookie.same-site=${CTSH_COOKIE_SAME_SITE:Strict}
app.cookie.max-age-seconds=${app.jwt.ttl-seconds}

app.url.frontend=${CTSH_FRONTEND_URL:http://localhost:3000}
app.url.backend=${CTSH_BACKEND_URL:http://localhost:8080}
app.uploads.dir=uploads
app.uploads.url-path=/uploads
